<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palmer Petroleum</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --brand-navy: #0e2e5c;
    --brand-navy-deep: #0a2044;
    --brand-orange: #f26722;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px;
    background: linear-gradient(114deg, var(--brand-navy-deep) 0%, var(--brand-navy) 80%);
    color: #ffffff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo svg { flex-shrink: 0; }
  .logo-text {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
    line-height: 1.15;
    text-align: left;
  }
  .logo-text span {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.7);
    letter-spacing: 2px;
  }
  h1 {
    margin: 0;
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 700;
  }
  p {
    margin: 0;
    max-width: 460px;
    font-size: 16px;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.75);
  }
  .bar {
    width: 48px;
    height: 3px;
    background: var(--brand-orange);
    border-radius: 2px;
  }
</style>
</head>
<body>
  <div class="logo">
    <svg width="44" height="44" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="1" width="50" height="50" rx="14" stroke="#ffffff" stroke-width="2"/>
      <path d="M26 12c6 8 10 13.5 10 18.5a10 10 0 1 1-20 0C16 25.5 20 20 26 12z" fill="#f26722"/>
    </svg>
    <div class="logo-text">PALMER<span>PETROLEUM</span></div>
  </div>
  <div class="bar" aria-hidden="true"></div>
  <h1>Coming soon.</h1>
  <p>Our new website is on its way. Thank you for your patience while we get things ready.</p>
</body>
</html>
